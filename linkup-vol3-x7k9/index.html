<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Link Up — Vol. 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS — amber phosphor on warm near-black.
     Grounded in analog instrumentation (VU meters, tape counters).
     ============================================================ */
  :root{
    --void:#0a0908;
    --panel:#15110d;
    --panel-edge:#241d15;
    --signal:#ff9d33;        /* amber phosphor — the one accent */
    --signal-soft:#ffc279;
    --signal-dim:#6d4a1f;
    --peak:#ff5a2c;          /* hotter tone for peak holds */
    --ink:#efe7da;
    --mute:#9a8f80;
    --line:rgba(255,157,51,.14);
    --glow:rgba(255,157,51,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100svh;
    font-family:"Space Grotesk",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,157,51,.10), transparent 55%),
      radial-gradient(80% 60% at 50% 120%, rgba(255,90,44,.06), transparent 60%),
      var(--void);
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
  }

  /* ---- The receiver unit ---- */
  .unit{
    width:min(500px,100%);
    position:relative;
    overflow:hidden;
    padding:clamp(16px,4.5vw,26px);
    border-radius:22px;
    border:1px solid var(--panel-edge);
    background:linear-gradient(180deg,#191510,var(--panel) 60%,#100d0a);
    box-shadow:
      0 40px 90px -40px rgba(0,0,0,.9),
      0 1px 0 0 rgba(255,255,255,.04) inset,
      0 0 0 1px rgba(0,0,0,.4) inset;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.99)}}

  /* ---- Top status bar ---- */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .status{display:flex;align-items:center;gap:9px}
  .status__dot{width:8px;height:8px;border-radius:50%;background:var(--signal-dim);transition:background .3s}
  .status.is-live .status__dot{background:var(--signal);animation:pulse 1.6s ease-in-out infinite}
  .status.is-off .status__dot{background:var(--peak)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}55%{box-shadow:0 0 0 6px rgba(255,157,51,0)}}
  .top__brand{color:var(--signal-soft);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;text-align:right}

  /* ---- Cover: flyer + reactive strip (signature) ---- */
  .cover{
    position:relative;
    margin-top:14px;
    display:flex;
    flex-direction:column;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #221a10;
    background:radial-gradient(120% 130% at 50% 0%, #100c08, #070504 75%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
    transition:box-shadow .4s;
  }
  .cover.is-live{
    box-shadow:0 0 52px -16px var(--glow), inset 0 0 0 1px rgba(0,0,0,.5);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{box-shadow:0 0 72px -12px var(--glow), inset 0 0 0 1px rgba(0,0,0,.5)}}
  .cover__art{position:relative;display:flex;justify-content:center;padding:10px 10px 0;overflow:hidden}
  .cover__img{display:block;max-width:100%;max-height:min(54vh,430px);border-radius:6px}
  .cover__sweep{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%);
    transform:translateX(-110%);
    animation:sweep 1.2s ease .3s both;
  }
  @keyframes sweep{to{transform:translateX(110%)}}
  .cover__viz{display:block;width:100%;height:60px}
  .cover__msg{
    position:absolute;left:0;right:0;bottom:0;display:none;
    padding:9px 14px;text-align:center;
    background:linear-gradient(0deg,rgba(7,5,4,.96),rgba(7,5,4,.0));
    font-family:"Space Mono",monospace;font-size:11.5px;letter-spacing:.03em;
    color:var(--signal-soft);
  }
  .cover.is-off .cover__msg{display:block}
  .cover.is-off .cover__viz{opacity:.35}

  /* ---- Track metadata ---- */
  .meta{margin-top:16px}
  .meta__title{margin:0;font-size:clamp(21px,5.4vw,28px);font-weight:700;letter-spacing:-.01em;line-height:1.07;color:var(--ink)}
  .meta__artist{margin:7px 0 0;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

  /* ---- Scrubber ---- */
  .scrub{margin-top:18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
  .scrub__time{font-family:"Space Mono",monospace;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:38px}
  .scrub__time--end{text-align:right}
  .scrub__bar{position:relative;height:26px;cursor:pointer;display:flex;align-items:center;border-radius:6px;outline:none}
  .scrub__track{position:relative;width:100%;height:5px;border-radius:99px;background:#2a2017;overflow:hidden}
  .scrub__buffer{position:absolute;left:0;top:0;height:100%;width:0;background:rgba(255,157,51,.18)}
  .scrub__fill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--signal-dim),var(--signal))}
  .scrub__knob{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:var(--signal);transform:translate(-50%,-50%);box-shadow:0 0 10px var(--glow);transition:transform .12s}
  .scrub__bar:hover .scrub__knob,.scrub__bar.is-grab .scrub__knob{transform:translate(-50%,-50%) scale(1.25)}
  .scrub__bar:focus-visible{box-shadow:0 0 0 2px var(--signal)}

  /* ---- Transport ---- */
  .transport{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:clamp(16px,6vw,28px)}
  .btn{border:none;background:none;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
  .btn svg{display:block}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--signal);border-radius:50%}
  .btn--skip{width:46px;height:46px;border-radius:50%;color:var(--mute);transition:color .2s,background .2s}
  .btn--skip:hover{color:var(--ink);background:rgba(255,157,51,.08)}
  .btn--skip svg{width:26px;height:26px}
  .btn--play{width:64px;height:64px;border-radius:50%;background:var(--signal);color:#140d05;box-shadow:0 0 0 1px rgba(255,194,121,.5) inset, 0 8px 24px -8px var(--glow);transition:transform .12s,filter .2s}
  .btn--play:hover{filter:brightness(1.06)}
  .btn--play:active{transform:scale(.95)}
  .btn--play svg{width:28px;height:28px;margin-left:2px}
  .btn--play.is-playing svg{margin-left:0}

  /* ---- Volume ---- */
  .vol{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:11px}
  .btn--vol{width:30px;height:30px;color:var(--mute);transition:color .2s}
  .btn--vol:hover{color:var(--ink)}
  .btn--vol svg{width:22px;height:22px}
  .vol__slider{-webkit-appearance:none;appearance:none;width:130px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--signal) 0%, var(--signal) var(--p,100%), #2a2017 var(--p,100%));cursor:pointer;outline:none}
  .vol__slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--glow);cursor:pointer}
  .vol__slider::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--glow);cursor:pointer}
  .vol__slider:focus-visible{box-shadow:0 0 0 2px var(--signal)}

  /* ---- Download (primary action) ---- */
  .download{
    margin-top:20px;display:flex;align-items:center;justify-content:center;gap:11px;
    width:100%;padding:15px;border-radius:13px;
    border:1px solid var(--signal);background:transparent;color:var(--signal);
    font-family:"Space Mono",monospace;font-size:13px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
    box-shadow:0 0 26px -16px var(--glow);
    transition:background .2s,color .2s,box-shadow .2s,transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .download svg{width:19px;height:19px}
  .download:hover{background:var(--signal);color:#140d05;box-shadow:0 8px 28px -10px var(--glow)}
  .download:active{transform:scale(.99)}
  .download:focus-visible{outline:none;box-shadow:0 0 0 2px var(--signal)}

  /* ---- Footer note ---- */
  .foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--mute)}
  .foot:empty{display:none;border:0;padding:0;margin:0}

  @media (max-width:430px){
    .vol__slider{width:108px}
    .transport{gap:22px}
  }

  @media (prefers-reduced-motion: reduce){
    .unit,.cover.is-live,.status.is-live .status__dot,.cover__sweep{animation:none}
    .cover.is-live{box-shadow:0 0 40px -16px var(--glow), inset 0 0 0 1px rgba(0,0,0,.5)}
    .cover__sweep{display:none}
  }
</style>
</head>
<body>
  <div class="stage">
    <section class="unit" aria-label="Audio player">

      <header class="top">
        <div class="status" id="status">
          <span class="status__dot"></span>
          <span id="statusLabel">Ready</span>
        </div>
        <div class="top__brand" id="brand">@thelinkup404</div>
      </header>

      <figure class="cover" id="cover" style="margin:14px 0 0">
        <div class="cover__art">
          <img class="cover__img" id="art" alt="The Link Up Vol. 3 flyer">
          <div class="cover__sweep"></div>
        </div>
        <canvas class="cover__viz" id="viz"></canvas>
        <figcaption class="cover__msg" id="msg">Audio not found — check the file path in CONFIG.</figcaption>
      </figure>

      <div class="meta">
        <h1 class="meta__title" id="title">The Link Up — Vol. 3</h1>
        <p class="meta__artist" id="artist">Open Aux Freestyle Cypher</p>
      </div>

      <div class="scrub">
        <span class="scrub__time" id="cur">0:00</span>
        <div class="scrub__bar" id="seek" role="slider" tabindex="0"
             aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
          <div class="scrub__track">
            <div class="scrub__buffer" id="buffer"></div>
            <div class="scrub__fill" id="fill"></div>
          </div>
          <div class="scrub__knob" id="knob"></div>
        </div>
        <span class="scrub__time scrub__time--end" id="dur">0:00</span>
      </div>

      <div class="transport">
        <button class="btn btn--skip" id="back" aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/>
            <text x="12" y="15.7" text-anchor="middle" font-size="7.5" font-family="Space Mono, monospace" fill="currentColor" stroke="none">15</text>
          </svg>
        </button>
        <button class="btn btn--play" id="play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn btn--skip" id="fwd" aria-label="Forward 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/>
            <text x="12" y="15.7" text-anchor="middle" font-size="7.5" font-family="Space Mono, monospace" fill="currentColor" stroke="none">15</text>
          </svg>
        </button>
      </div>

      <div class="vol">
        <button class="btn btn--vol" id="mute" aria-label="Mute"></button>
        <input class="vol__slider" id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>

      <a class="download" id="download" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>
        </svg>
        <span>Download</span>
      </a>

      <footer class="foot" id="foot">Thanks for pulling up.</footer>
    </section>
  </div>

  <audio id="audio" preload="metadata"></audio>

<script>
/* ================================================================
   CONFIG — edit these. This is the only part you need to touch.
   (The embedded flyer lives at the very bottom as ARTWORK.)
   ================================================================ */
const CONFIG = {
  audioSrc:     "Link_Up_Vol_3_Audio.mp3",   // path/URL to your audio file (keep it in the same folder as this page)
  downloadName: "The Link Up Vol 3.mp3",     // filename the listener gets when they download
  title:        "The Link Up — Vol. 3",      // what the recording is
  artist:       "Open Aux Freestyle Cypher", // subtitle
  brand:        "@thelinkup404",             // small label, top-right
  footer:       "Thanks for pulling up.",    // small line at the bottom ("" to hide)
  artworkSrc:   "",                          // leave "" to use the embedded Vol. 3 flyer; or set a path/URL to swap it
  accent:       "",                          // optional hex to override the amber (e.g. "#33b0ff"); "" keeps amber
  crossOrigin:  false                        // set true ONLY if audio is on a DIFFERENT domain that sends CORS headers
};
/* ================================================================ */

const $ = id => document.getElementById(id);
const audio = $("audio");
const cover = $("cover"), statusEl = $("status"), statusLabel = $("statusLabel");
const seek = $("seek"), fill = $("fill"), buffer = $("buffer"), knob = $("knob");
const curEl = $("cur"), durEl = $("dur");
const playBtn = $("play"), playIcon = $("playIcon");
const volSlider = $("vol"), muteBtn = $("mute");

// --- Apply config ---
if (CONFIG.accent){
  document.documentElement.style.setProperty("--signal", CONFIG.accent);
  document.documentElement.style.setProperty("--glow", hexToGlow(CONFIG.accent));
}
$("title").textContent = CONFIG.title;
$("artist").textContent = CONFIG.artist;
$("brand").textContent = CONFIG.brand;
$("foot").textContent = CONFIG.footer || "";
document.title = CONFIG.title;
if (CONFIG.crossOrigin) audio.crossOrigin = "anonymous";
audio.src = CONFIG.audioSrc;

// (artwork is applied at the very bottom, after ARTWORK is defined)

const dl = $("download");
dl.href = CONFIG.audioSrc;
dl.setAttribute("download", CONFIG.downloadName);

function hexToGlow(hex){
  const n = parseInt(hex.replace("#",""),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},.5)`;
}

/* ---------- Icons ---------- */
const ICON_ON  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 9.5l4 5M21 9.5l-4 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
muteBtn.innerHTML = ICON_ON;
const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/>';

/* ================================================================
   PLAYBACK
   ================================================================ */
function fmt(s){
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return m + ":" + String(ss).padStart(2,"0");
}
function setStatus(word, state){
  statusLabel.textContent = word;
  statusEl.classList.toggle("is-live", state === "live");
  statusEl.classList.toggle("is-off",  state === "off");
}

let dragging = false;

playBtn.addEventListener("click", ()=>{
  if (audio.paused){
    ensureGraph();
    if (ctx && ctx.state === "suspended") ctx.resume();
    audio.play().catch(()=> setStatus("Offline","off"));
  } else { audio.pause(); }
});

audio.addEventListener("play", ()=>{
  playIcon.innerHTML = ICON_PAUSE;
  playBtn.classList.add("is-playing");
  playBtn.setAttribute("aria-label","Pause");
  cover.classList.add("is-live");
  cover.classList.remove("is-off");
  setStatus("Live","live");
  startLoop();
});
audio.addEventListener("pause", ()=>{
  playIcon.innerHTML = ICON_PLAY;
  playBtn.classList.remove("is-playing");
  playBtn.setAttribute("aria-label","Play");
  cover.classList.remove("is-live");
  setStatus("Ready");
});
audio.addEventListener("ended", ()=> audio.currentTime = 0);

audio.addEventListener("loadedmetadata", ()=>{
  durEl.textContent = fmt(audio.duration);
  seek.setAttribute("aria-valuemax", Math.floor(audio.duration || 0));
});
audio.addEventListener("canplay", ()=>{ if (statusEl.classList.contains("is-off")) setStatus("Ready"); cover.classList.remove("is-off"); });
audio.addEventListener("error", ()=>{ setStatus("Offline","off"); cover.classList.add("is-off"); });

audio.addEventListener("timeupdate", ()=>{
  if (dragging) return;
  const d = audio.duration || 0;
  const p = d ? audio.currentTime / d : 0;
  paintSeek(p);
  curEl.textContent = fmt(audio.currentTime);
  seek.setAttribute("aria-valuenow", Math.floor(audio.currentTime));
  seek.setAttribute("aria-valuetext", fmt(audio.currentTime));
});
audio.addEventListener("progress", ()=>{
  try{
    if (audio.buffered.length && audio.duration){
      buffer.style.width = (audio.buffered.end(audio.buffered.length-1)/audio.duration*100) + "%";
    }
  }catch(e){}
});

function paintSeek(p){
  p = Math.max(0, Math.min(1, p));
  fill.style.width = (p*100) + "%";
  knob.style.left  = (p*100) + "%";
}

$("back").addEventListener("click", ()=> audio.currentTime = Math.max(0, audio.currentTime - 15));
$("fwd").addEventListener("click",  ()=> audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 15));

function seekFromEvent(clientX){
  const r = seek.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  paintSeek(p);
  curEl.textContent = fmt(p * (audio.duration||0));
  if (audio.duration) audio.currentTime = p * audio.duration;
}
seek.addEventListener("pointerdown", e=>{ dragging = true; seek.classList.add("is-grab"); seek.setPointerCapture(e.pointerId); seekFromEvent(e.clientX); });
seek.addEventListener("pointermove", e=>{ if (dragging) seekFromEvent(e.clientX); });
seek.addEventListener("pointerup",   ()=>{ dragging = false; seek.classList.remove("is-grab"); });
seek.addEventListener("pointercancel",()=>{ dragging = false; seek.classList.remove("is-grab"); });
seek.addEventListener("keydown", e=>{
  const d = audio.duration || 0; if (!d) return;
  let t = audio.currentTime;
  if (e.key === "ArrowRight") t += 5;
  else if (e.key === "ArrowLeft") t -= 5;
  else if (e.key === "Home") t = 0;
  else if (e.key === "End") t = d;
  else return;
  e.preventDefault();
  audio.currentTime = Math.max(0, Math.min(d, t));
});

function applyVol(){
  audio.volume = parseFloat(volSlider.value);
  audio.muted = audio.volume === 0;
  volSlider.style.setProperty("--p", (audio.volume*100) + "%");
  muteBtn.innerHTML = audio.muted ? ICON_OFF : ICON_ON;
}
volSlider.addEventListener("input", applyVol);
let lastVol = 1;
muteBtn.addEventListener("click", ()=>{
  if (audio.muted || audio.volume === 0){ volSlider.value = lastVol || 1; }
  else { lastVol = audio.volume; volSlider.value = 0; }
  applyVol();
});
applyVol();

/* ================================================================
   VISUALIZER — slim reactive strip under the flyer.
   Real Web Audio spectrum, with a synthetic fallback so it
   always looks alive even if the audio can't be analysed.
   ================================================================ */
const canvas = $("viz");
const cx = canvas.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let ctx, analyser, freq, graphReady = false, graphFailed = false;
let useSynthetic = false, zeroFrames = 0;

function ensureGraph(){
  if (graphReady || graphFailed) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("no webaudio");
    ctx = new AC();
    const srcNode = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    srcNode.connect(analyser);
    analyser.connect(ctx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    graphReady = true;
  }catch(e){ graphFailed = true; }
}

const BARS = 52;
const disp = new Array(BARS).fill(0);
const peaks = new Array(BARS).fill(0);
let energy = 0.06, running = false, t0 = performance.now();

function sizeCanvas(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  cx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas();
if (window.ResizeObserver) new ResizeObserver(sizeCanvas).observe(canvas);
else window.addEventListener("resize", sizeCanvas);

function targetHeights(timeSec){
  const out = new Array(BARS);
  const playing = !audio.paused;
  if (graphReady && !useSynthetic){
    analyser.getByteFrequencyData(freq);
    let sum = 0;
    for (let i=0;i<BARS;i++){
      const bin = Math.floor(i / BARS * (freq.length * 0.78));
      let v = freq[bin] / 255;
      v *= 0.75 + (i/BARS)*0.9;
      out[i] = Math.min(1, v);
      sum += freq[bin];
    }
    if (playing){ if (sum === 0) zeroFrames++; else zeroFrames = 0; if (zeroFrames > 60) useSynthetic = true; }
    return out;
  }
  const tt = reduce ? 0 : timeSec;
  for (let i=0;i<BARS;i++){
    const tilt = 1 - i/BARS*0.5;
    const a = Math.sin(tt*1.7 + i*0.55)*0.5 + 0.5;
    const b = Math.sin(tt*0.9 + i*0.13 + 1.3)*0.5 + 0.5;
    const n = reduce ? 0 : Math.random()*0.12;
    out[i] = Math.min(1, (a*0.6 + b*0.4) * tilt + n);
  }
  return out;
}

function roundRect(x,y,w,h,radius){
  const rr = Math.min(radius, w/2, Math.abs(h)/2);
  cx.beginPath();
  cx.moveTo(x+rr,y);
  cx.arcTo(x+w,y,x+w,y+h,rr);
  cx.arcTo(x+w,y+h,x,y+h,rr);
  cx.arcTo(x,y+h,x,y,rr);
  cx.arcTo(x,y,x+w,y,rr);
  cx.closePath();
}

function draw(now){
  if (!running) return;
  requestAnimationFrame(draw);

  const r = canvas.getBoundingClientRect();
  const W = r.width, H = r.height;
  const t = (now - t0) / 1000;

  const target = audio.paused ? 0.06 : 1;
  energy += (target - energy) * (reduce ? 1 : 0.06);

  const heights = targetHeights(t);
  cx.clearRect(0,0,W,H);

  const baseline = H * 0.9;
  const gap = Math.max(1.5, W * 0.006);
  const bw = (W - gap*(BARS-1)) / BARS;
  const maxH = baseline * 0.92;

  const grad = cx.createLinearGradient(0, baseline, 0, baseline - maxH);
  grad.addColorStop(0, "#ff7a1a");
  grad.addColorStop(1, "#ffcf86");
  cx.shadowColor = "rgba(255,157,51," + (0.3 + energy*0.4) + ")";

  for (let i=0;i<BARS;i++){
    const target_i = heights[i] * energy;
    disp[i] += (target_i - disp[i]) * (reduce ? 1 : 0.35);
    const h = Math.max(1.5, disp[i] * maxH);
    const x = i * (bw + gap);

    peaks[i] = Math.max(peaks[i] - (reduce?1:0.012), disp[i]);
    const ph = Math.max(1.5, peaks[i] * maxH);

    cx.globalAlpha = 1;
    cx.shadowBlur = reduce ? 0 : 5 + energy*5;
    cx.fillStyle = grad;
    roundRect(x, baseline - h, bw, h, Math.min(bw/2, 2.5));
    cx.fill();

    if (peaks[i] > 0.05){
      cx.globalAlpha = 0.9;
      cx.shadowBlur = 0;
      cx.fillStyle = "#ff5a2c";
      cx.fillRect(x, baseline - ph - 1.5, bw, 1.5);
    }
  }

  cx.globalAlpha = 0.5;
  cx.shadowBlur = 0;
  cx.fillStyle = "rgba(255,157,51,.14)";
  cx.fillRect(0, baseline+0.5, W, 1);
  cx.globalAlpha = 1;
}

function startLoop(){ if (running) return; running = true; t0 = performance.now(); requestAnimationFrame(draw); }
startLoop();
